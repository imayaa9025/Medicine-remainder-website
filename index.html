<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicine Reminder</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef4ff;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

h1 {
    text-align: center;
    color: #315bd6;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px 0;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

button {
    padding: 12px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

#addBtn {
    width: 100%;
    margin-top: 20px;
    background: #315bd6;
    color: white;
}

.medicine {
    background: #f0f5ff;
    margin-top: 15px;
    padding: 15px;
    border-radius: 8px;
}

.deleteBtn {
    background: #dc3545;
    color: white;
}

#status {
    color: #267443;
}
</style>
</head>

<body>
<div class="container">

<h1>💊 Medicine Reminder</h1>
<p>Manage your daily medicine schedule.</p>

<form id="medicineForm">
    <label for="medicineName">Medicine Name</label>
    <input id="medicineName" type="text"
           placeholder="Enter medicine name" required>

    <label for="dosage">Dosage Instructions</label>
    <input id="dosage" type="text"
           placeholder="As prescribed" required>

    <label for="medicineTime">Reminder Time</label>
    <input id="medicineTime" type="time" required>

    <button id="addBtn" type="submit">+ Add Medicine</button>
</form>

<p id="status" role="status"></p>

<h2>📋 My Medicines</h2>
<div id="medicineList"></div>

</div>

<script>
(function () {
    const form = document.getElementById("medicineForm");
    const nameInput = document.getElementById("medicineName");
    const dosageInput = document.getElementById("dosage");
    const timeInput = document.getElementById("medicineTime");
    const list = document.getElementById("medicineList");
    const status = document.getElementById("status");

    let medicines = [];

    try {
        medicines = JSON.parse(
            localStorage.getItem("medicineList") || "[]"
        );

        if (!Array.isArray(medicines)) medicines = [];
    } catch (error) {
        medicines = [];
    }

    function saveData() {
        try {
            localStorage.setItem(
                "medicineList",
                JSON.stringify(medicines)
            );
        } catch (error) {
            status.textContent =
                "Could not save data in this browser.";
        }
    }

    function renderMedicines() {
        list.replaceChildren();

        if (medicines.length === 0) {
            const empty = document.createElement("p");
            empty.textContent = "No medicines added yet.";
            list.appendChild(empty);
            return;
        }

        medicines.forEach(function (medicine, index) {
            const card = document.createElement("div");
            card.className = "medicine";

            const title = document.createElement("h3");
            title.textContent = "💊 " + medicine.name;

            const dosage = document.createElement("p");
            dosage.textContent = "Dosage: " + medicine.dosage;

            const time = document.createElement("p");
            time.textContent = "Time: " + medicine.time;

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "deleteBtn";
            deleteBtn.textContent = "Delete";

            deleteBtn.addEventListener("click", function () {
                medicines.splice(index, 1);
                saveData();
                renderMedicines();
                status.textContent = "Medicine deleted.";
            });

            card.append(title, dosage, time, deleteBtn);
            list.appendChild(card);
        });
    }

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        const name = nameInput.value.trim();
        const dosage = dosageInput.value.trim();
        const time = timeInput.value;

        if (!name || !dosage || !time) {
            status.textContent = "Please fill in all fields.";
            return;
        }

        medicines.push({
            name: name,
            dosage: dosage,
            time: time
        });

        saveData();
        renderMedicines();
        form.reset();

        status.textContent = "Medicine added successfully!";
    });

    renderMedicines();
})();
</script>

</body>
</html>
