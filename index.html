<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Reminder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1, h2 {
            text-align: center;
            color: #4f46e5;
        }

        .subtitle {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn {
            width: 100%;
            margin-top: 20px;
            background: #4f46e5;
            color: white;
        }

        .notification-btn {
            width: 100%;
            margin-top: 10px;
            background: #dcfce7;
            color: #166534;
        }

        .medicine-card {
            background: #f5f3ff;
            border-left: 5px solid #4f46e5;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .medicine-card h3 {
            margin-top: 0;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
            margin-top: 8px;
        }

        .empty {
            text-align: center;
            color: #777;
        }

        #status {
            text-align: center;
            color: #555;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💊 Medicine Reminder</h1>

        <p class="subtitle">
            Take your medicines on time!
        </p>

        <form id="medicineForm">

            <label for="medicineName">Medicine Name</label>
            <input
                type="text"
                id="medicineName"
                placeholder="Enter medicine name"
                required
            >

            <label for="dosage">Dosage Instructions</label>
            <input
                type="text"
                id="dosage"
                placeholder="Example: One tablet after food"
                required
            >

            <label for="reminderTime">Reminder Time</label>
            <input
                type="time"
                id="reminderTime"
                required
            >

            <button type="submit" class="add-btn">
                ➕ Add Medicine
            </button>

        </form>

        <button type="button" class="notification-btn" id="notificationBtn">
            🔔 Enable Notifications
        </button>

        <h2>My Medicines</h2>

        <div id="medicineList">
            <p class="empty">No medicines added yet.</p>
        </div>

        <p id="status">Add a medicine to get started.</p>

        <footer>
            Medicine Reminder - Student Project
        </footer>

    </div>

    <script>
        const form = document.getElementById("medicineForm");
        const medicineList = document.getElementById("medicineList");
        const statusText = document.getElementById("status");
        const notificationBtn = document.getElementById("notificationBtn");

        let medicines = [];

        try {
            medicines = JSON.parse(
                localStorage.getItem("medicineReminderData") || "[]"
            );

            if (!Array.isArray(medicines)) {
                medicines = [];
            }
        } catch (error) {
            medicines = [];
        }

        function saveMedicines() {
            try {
                localStorage.setItem(
                    "medicineReminderData",
                    JSON.stringify(medicines)
                );
            } catch (error) {
                statusText.textContent =
                    "Unable to save data in this browser.";
            }
        }

        function displayMedicines() {
            medicineList.innerHTML = "";

            if (medicines.length === 0) {
                medicineList.innerHTML =
                    '<p class="empty">No medicines added yet.</p>';
                return;
            }

            medicines.forEach(function(medicine) {
                const card = document.createElement("div");
                card.className = "medicine-card";

                const title = document.createElement("h3");
                title.textContent = "💊 " + medicine.name;

                const dosage = document.createElement("p");
                dosage.textContent = "Dosage: " + medicine.dosage;

                const time = document.createElement("p");
                time.textContent = "⏰ Time: " + medicine.time;

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "🗑️ Delete";

                deleteButton.addEventListener("click", function() {
                    medicines = medicines.filter(function(item) {
                        return item.id !== medicine.id;
                    });

                    saveMedicines();
                    displayMedicines();

                    statusText.textContent = "Medicine deleted.";
                });

                card.appendChild(title);
                card.appendChild(dosage);
                card.appendChild(time);
                card.appendChild(deleteButton);

                medicineList.appendChild(card);
            });
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("medicineName")
                .value.trim();

            const dosage = document.getElementById("dosage")
                .value.trim();

            const time = document.getElementById("reminderTime")
                .value;

            if (!name || !dosage || !time) {
                statusText.textContent = "Please fill in all fields.";
                return;
            }

            medicines.push({
                id: Date.now() + Math.random(),
                name: name,
                dosage: dosage,
                time: time,
                lastAlert: ""
            });

            saveMedicines();
            displayMedicines();
            form.reset();

            statusText.textContent = "Medicine added successfully!";
        });

        notificationBtn.addEventListener("click", async function() {
            if (!("Notification" in window)) {
                statusText.textContent =
                    "This browser does not support notifications.";
                return;
            }

            try {
                const permission =
                    await Notification.requestPermission();

                if (permission === "granted") {
                    statusText.textContent =
                        "Notifications enabled successfully!";
                } else {
                    statusText.textContent =
                        "Notifications were not enabled.";
                }
            } catch (error) {
                statusText.textContent =
                    "Could not enable notifications.";
            }
        });

        function checkReminders() {
            const now = new Date();

            const currentTime =
                String(now.getHours()).padStart(2, "0") + ":" +
                String(now.getMinutes()).padStart(2, "0");

            const today =
                now.getFullYear() + "-" +
                String(now.getMonth() + 1).padStart(2, "0") + "-" +
                String(now.getDate()).padStart(2, "0");

            let dataChanged = false;

            medicines.forEach(function(medicine) {
                if (
                    medicine.time === currentTime &&
                    medicine.lastAlert !== today
                ) {
                    medicine.lastAlert = today;
                    dataChanged = true;

                    alert(
                        "💊 Medicine Reminder\n\n" +
                        "Medicine: " + medicine.name + "\n" +
                        "Dosage: " + medicine.dosage
                    );

                    if (
                        "Notification" in window &&
                        Notification.permission === "granted"
                    ) {
                        try {
                            new Notification("Medicine Reminder", {
                                body: medicine.name +
                                    " - " + medicine.dosage
                            });
                        } catch (error) {
                            // The alert above is the fallback.
                        }
                    }
                }
            });

            if (dataChanged) {
                saveMedicines();
            }
        }

        displayMedicines();

        // Check the reminder time every 10 seconds.
        checkReminders();
        setInterval(checkReminders, 10000);
    </script>

</body>
</html>
